<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cutline whiteboard engine</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #hand-canvas {
        pointer-events: none;
      }
      #engine-controls {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="main-canvas" width="1280" height="720"></canvas>
    <canvas id="hand-canvas" width="1280" height="720"></canvas>
    <div id="engine-controls" aria-hidden="true"></div>
    <script src="./animations.js"></script>
    <script src="./host.js"></script>
  </body>
</html>
